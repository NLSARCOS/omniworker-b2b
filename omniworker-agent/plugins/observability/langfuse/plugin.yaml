name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Flux Agent — traces conversations, LLM calls, and tool usage. Opt-in via `flux-agent plugins enable observability/langfuse` or `flux-agent tools → Langfuse Observability`."
author: Flux Agent
requires_env:
  - FLUX AGENT_LANGFUSE_PUBLIC_KEY
  - FLUX AGENT_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
